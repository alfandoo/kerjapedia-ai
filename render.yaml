services:
  - type: web
    name: kerjapedia-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /ready
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: regulations

      # Database
      - key: DATABASE_URL
        sync: false

      # LLM
      - key: LLM_PROVIDER
        value: groq
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_RETRIES
        value: "2"
      - key: OPENROUTER_MAX_TOKENS
        value: "3000"
      - key: OPENROUTER_FALLBACK_MODELS
        value: "google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_SECONDS
        value: "30"
      - key: GROQ_MAX_RETRIES
        value: "2"
      - key: GROQ_MAX_TOKENS
        value: "6000"

      # Redis
      - key: REDIS_URL
        sync: false

      # Vector Store
      - key: VECTOR_STORE
        value: upstash_vector

      # Upstash Vector (hosted hybrid: text-embedding-3-small + BM25).
      # URL/token are dashboard-managed secrets; never hardcode values here.
      - key: UPSTASH_VECTOR_URL
        sync: false
      - key: UPSTASH_VECTOR_TOKEN
        sync: false
      - key: UPSTASH_VECTOR_DIMENSION
        value: "1536"
      - key: UPSTASH_VECTOR_NAMESPACE
        value: production

      # Embedding (local artifact pipeline only)
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: INGESTION_EMBEDDING_TIMEOUT_SECONDS
        value: "300"
      - key: INGESTION_EMBEDDING_BATCH_SIZE
        value: "8"

      # App
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://kerjapedia-ai.vercel.app"

      # SMTP
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: SMTP_SENDER_NAME
        value: KerjaPedia
      - key: EMAIL_OTP_EXPIRY_MINUTES
        value: "15"

      # Reranker: heuristic (built in, no extra service)

      # Claim verifier (LLM-backed in production; deterministic is dev-only)
      - key: CLAIM_VERIFIER_PROVIDER
        value: groq
      - key: CLAIM_VERIFIER_MODEL
        value: openai/gpt-oss-120b

      # Evaluation
      - key: RAGAS_ENABLED
        value: "true"
      - key: RAGAS_SAMPLE_RATE
        value: "0.05"
