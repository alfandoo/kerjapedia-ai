services:
  - type: web
    name: kerjapedia-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /ready
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: regulations

      # Database
      - key: DATABASE_URL
        sync: false

      # LLM
      - key: LLM_PROVIDER
        value: groq
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_RETRIES
        value: "2"
      - key: OPENROUTER_MAX_TOKENS
        value: "3000"
      - key: OPENROUTER_FALLBACK_MODELS
        value: "google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT_SECONDS
        value: "30"
      - key: GROQ_MAX_RETRIES
        value: "2"
      - key: GROQ_MAX_TOKENS
        value: "3000"

      # Redis
      - key: REDIS_URL
        sync: false

      # Vector Store
      - key: VECTOR_STORE
        value: upstash_vector
      - key: TOP_K
        value: "5"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: kerjapedia
      - key: PINECONE_NAMESPACE
        value: production
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1

      # Upstash Vector
      - key: UPSTASH_VECTOR_URL
        value: "https://gorgeous-mustang-26578-us1-vector.upstash.io"
      - key: UPSTASH_VECTOR_TOKEN
        value: "ABoFMGdvcmdlb3VzLW11c3RhbmctMjY1NzgtdXMxYWRtaW5aVFkyWWpZMVltWXRabUpoWWkwMFpqYzBMV0poWlRrdFltRmxObUV3T1RrNU5qRTA="
      - key: UPSTASH_VECTOR_DIMENSION
        value: "1024"
      - key: UPSTASH_VECTOR_NAMESPACE
        value: production

      # Embedding
      - key: EMBEDDING_PROVIDER
        value: pinecone_inference
      - key: EMBEDDING_MODEL
        value: multilingual-e5-large
      - key: EMBEDDING_MODEL_REVISION
        value: provider-managed
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: INGESTION_EMBEDDING_TIMEOUT_SECONDS
        value: "300"
      - key: INGESTION_EMBEDDING_BATCH_SIZE
        value: "8"

      # App
      - key: APP_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: "https://kerjapedia-ai.vercel.app"

      # SMTP
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER_EMAIL
        sync: false
      - key: SMTP_SENDER_NAME
        value: KerjaPedia
      - key: EMAIL_OTP_EXPIRY_MINUTES
        value: "15"

      # Reranker
      - key: RERANKER_PROVIDER
        value: pinecone
      - key: RERANKER_MODEL
        value: bge-reranker-v2-m3

      # Claim verifier (LLM-backed in production; deterministic is dev-only)
      - key: CLAIM_VERIFIER_PROVIDER
        value: groq
      - key: CLAIM_VERIFIER_MODEL
        value: openai/gpt-oss-120b

      # Evaluation
      - key: RAGAS_ENABLED
        value: "true"
      - key: RAGAS_SAMPLE_RATE
        value: "0.05"
