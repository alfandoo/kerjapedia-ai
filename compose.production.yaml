name: kerjapedia-ai-production

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kerjapedia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kerjapedia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./dataset:/workspace/dataset:ro
      - production_storage:/workspace/storage
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  production_storage:
