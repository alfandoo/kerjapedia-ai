name: kerjapedia-ai-production

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kerjapedia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kerjapedia}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./dataset:/workspace/dataset:ro
      - production_storage:/workspace/storage
      - model_cache:/workspace/model-cache
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s

  ingestion-preflight:
    build:
      context: ./apps/api
    restart: "no"
    command: ["python", "-m", "app.services.ingestion.preflight"]
    env_file: .env.production
    volumes:
      - ./dataset:/workspace/dataset:ro
      - production_storage:/workspace/storage
      - model_cache:/workspace/model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.services.ingestion.tasks.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    env_file: .env.production
    volumes:
      - ./dataset:/workspace/dataset:ro
      - production_storage:/workspace/storage
      - model_cache:/workspace/model-cache
    depends_on:
      ingestion-preflight:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  scheduler:
    build:
      context: ./apps/api
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.services.ingestion.tasks.celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  production_storage:
  redis_data:
  model_cache:
