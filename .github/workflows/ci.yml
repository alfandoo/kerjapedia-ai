name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kerjapedia_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kerjapedia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/kerjapedia_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/kerjapedia_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript qpdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-ind unpaper
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m alembic upgrade head
      - run: python -m alembic downgrade 20260807_0003
      - run: python -m alembic upgrade head
      - run: python -m pytest
